<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Créez votre compte ALLAIN2MARIE pour suivre vos commandes et profiter d'avantages exclusifs.">
  <title>ALLAIN2MARIE | Mon Compte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo {
      width: 120px;
      height: auto;
      margin: 0 auto 1rem;
      display: block;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #000;
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.5;
    }

    .auth-tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 2rem;
    }

    .auth-tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: white;
      color: #000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      color: #64748b;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    .input-with-toggle {
      position: relative;
    }

    .forgot-password {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      color: #64748b;
      text-decoration: none;
      margin-top: 0.5rem;
      font-weight: 500;
    }

    .forgot-password:hover {
      color: #000;
      text-decoration: underline;
    }

    .btn-primary {
      width: 100%;
      padding: 14px 20px;
      background: #000;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary:hover {
      background: #1a1a1a;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      margin: 2rem 0;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .auth-divider span {
      padding: 0 1rem;
    }

    .btn-google {
      width: 100%;
      padding: 12px 20px;
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #f1f5f9;
    }

    .auth-footer a {
      color: #000;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .auth-alert {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 1.5rem;
      color: #dc2626;
      font-size: 0.9rem;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease-out;
    }

    .auth-alert.show {
      display: flex;
    }

    .auth-alert.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #16a34a;
    }

    .auth-alert svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logged-in-view {
      display: none;
      text-align: center;
    }

    .logged-in-view.show {
      display: block;
    }

    .user-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f1f5f9;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
    }

    .user-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #000;
      margin-bottom: 0.25rem;
    }

    .user-email {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .btn-logout {
      padding: 12px 24px;
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ef4444;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-logout:hover {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .orders-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #f1f5f9;
      text-align: left;
    }

    .orders-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 1rem;
    }

    .no-orders {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      padding: 1rem 0;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f8fafc;
    }

    .order-info {
      flex: 1;
    }

    .order-id {
      font-weight: 700;
      color: #000;
      font-size: 0.9rem;
    }

    .order-date {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .order-status {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #475569;
    }

    .order-status.delivered {
      background: #dcfce7;
      color: #16a34a;
    }

    .order-status.pending {
      background: #fef3c7;
      color: #d97706;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Auth Header -->
    <div class="auth-header">
      <img src="logo.png" alt="ALLAIN2MARIE" class="auth-logo">
      <h1 class="auth-title">Bienvenue</h1>
      <p class="auth-subtitle">Connectez-vous pour accéder à votre compte</p>
    </div>

    <!-- Error Alert -->
    <div class="auth-alert" id="authAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="authAlertMsg">Erreur</span>
    </div>

    <!-- Logged In View -->
    <div class="logged-in-view" id="loggedInView">
      <div class="user-avatar" id="userAvatar">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="user-name" id="userName">Bonjour !</div>
      <div class="user-email" id="userEmail"></div>
      <button class="btn-logout" id="userLogoutBtn">Se déconnecter</button>

      <div class="orders-section">
        <div class="orders-title">Mes commandes</div>
        <div id="userOrdersList">
          <div class="no-orders">Aucune commande pour le moment</div>
        </div>
      </div>
    </div>

    <!-- Auth Forms -->
    <div id="authFormsView">
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Connexion</button>
        <button class="auth-tab" id="tabSignup">Inscription</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form active" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Mot de passe</label>
          <div class="input-with-toggle">
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
            <button type="button" class="password-toggle" id="toggleLoginPassword" aria-label="Afficher le mot de passe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <a href="#" class="forgot-password" id="forgotPasswordLink">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn-primary" id="submitLoginBtn">Se connecter</button>
      </form>

      <!-- Signup Form -->
      <form class="auth-form" id="signupForm">
        <div class="form-group">
          <label class="form-label" for="signupName">Nom complet</label>
          <input type="text" id="signupName" class="form-input" placeholder="Ex: Jean Kouassi" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Mot de passe</label>
          <div class="input-with-toggle">
            <input type="password" id="signupPassword" class="form-input" placeholder="Minimum 6 caractères" required minlength="6">
            <button type="button" class="password-toggle" id="toggleSignupPassword" aria-label="Afficher le mot de passe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitSignupBtn">Créer mon compte</button>
      </form>

      <!-- Google Button -->
      <div class="auth-divider">
        <span>ou continuer avec</span>
      </div>
      <button type="button" class="btn-google" id="googleAuthBtn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        Google
      </button>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      <a href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Retour à la boutique
      </a>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="db.js"></script>
  <script src="auth.js"></script>
</body>
</html>
